  /api/theatre/actors/:
    get:
      operationId: theatre_actors_list
      summary: List actors
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - theatre
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actor'
          description: ''
    post:
      operationId: theatre_actors_create
      tags:
      - theatre
      requestBody:
