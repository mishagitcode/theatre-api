          description: ''
components:
  schemas:
    Actor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
      required:
      - first_name
      - id
      - last_name
    ActorRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - first_name
      - last_name
    Genre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    GenreRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    PatchedActorRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedGenreRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedPerformanceCreateUpdateRequest:
      type: object
      properties:
        play:
          type: integer
